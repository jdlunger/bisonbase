[workspace]
members = ["core", "wasm"]

# The server.
[package]
name = "fedcrdt"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
axum-server = "0.8"
base64 = "0.23.1"
bs58 = "0.5.1"
ed25519-dalek = "3.0.0"
fedcrdt-core = { path = "core" }
getrandom = "0.4.3"
reqwest = "0.13.5"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rust-embed = { version = "8", features = ["mime-guess"] }
rustls-acme = { version = "0.15", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.6", features = ["cors"] }

# For the web client's wasm (see `npm run wasm`): small over fast.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
