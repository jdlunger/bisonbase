<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>federated crdt</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
  li { margin-bottom: .75rem; }
  code { word-break: break-all; font-size: .8rem; color: #555; }
  #error { color: #b00; }
</style>
</head>
<body>
<h1>federated crdt</h1>
<div id="auth"></div>
<p id="error"></p>
<h2>Users</h2>
<ul id="users"></ul>

<script>
const $ = (id) => document.getElementById(id);

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.status === 204 ? null : res.json();
}

async function register() {
  const { id, options } = await api("/api/register/start", {});
  const publicKey = options.publicKey;
  publicKey.authenticatorSelection = { ...publicKey.authenticatorSelection, residentKey: "required", requireResidentKey: true };
  const cred = await navigator.credentials.create({
    publicKey: PublicKeyCredential.parseCreationOptionsFromJSON(publicKey),
  });
  await api("/api/register/finish", { id, credential: cred.toJSON() });
}

async function login() {
  const { id, options } = await api("/api/login/start", {});
  const cred = await navigator.credentials.get({
    publicKey: PublicKeyCredential.parseRequestOptionsFromJSON(options.publicKey),
  });
  await api("/api/login/finish", { id, credential: cred.toJSON() });
}

async function signIn() {
  try {
    await login();
  } catch (e) {
    throw new Error(`Couldn't sign in with an existing passkey (${e.message}). If you don't have one for this site yet, use "Create new passkey".`);
  }
}

async function logout() { await api("/api/logout", {}); }

function action(fn) {
  return async () => {
    $("error").textContent = "";
    try { await fn(); } catch (e) { $("error").textContent = e.message; }
    render();
  };
}

function button(label, fn) {
  const b = document.createElement("button");
  b.textContent = label;
  b.onclick = action(fn);
  return b;
}

function userItem(u) {
  const li = document.createElement("li");
  li.innerHTML = "<strong></strong><br><code></code>";
  li.querySelector("strong").textContent = u.phrase;
  li.querySelector("code").textContent = u.pubkey;
  return li;
}

async function render() {
  const [me, users] = await Promise.all([api("/api/me"), api("/api/users")]);
  const auth = $("auth");
  auth.replaceChildren();
  if (me) {
    auth.append(`Already signed in as ${me.phrase} `, button("Sign out", logout));
  } else {
    auth.append(button("Sign in with existing passkey", signIn), " ", button("Create new passkey", register));
  }
  $("users").replaceChildren(...(users.length ? users.map(userItem) : ["No users yet."]));
}

render();
</script>
</body>
</html>
