# Builds the @bisonbase/server native addon for every platform and, on a `server-v*` tag,
# publishes @bisonbase/server plus the @bisonbase/binding-* platform packages to npm.
# Run it by hand (Actions tab → node → Run workflow) to build and test without publishing.
#
# Each platform goes build → test → publish on its own, so one broken platform doesn't stop
# the others from shipping. @bisonbase/server is published either way and lists every binding
# as an optional dependency; re-running a failed platform's jobs later fills in the gap.
name: node

on:
  push:
    tags: ['server-v*']
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  # Fail fast on a mismatched tag, before anything is published.
  check-tag:
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches every package.json
        working-directory: node
        run: |
          status=0
          for f in package.json npm/*/package.json; do
            version=$(node -p "require('./$f').version")
            if [ "server-v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME doesn't match node/$f version $version"
              status=1
            fi
          done
          exit $status

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error

  build:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        # The one list of platforms; `test` and `publish-binding` reuse it.
        include: &targets
          # Linux builds use napi's glibc 2.17 toolchain so they load on old distros too.
          - target: x86_64-unknown-linux-gnu
            npm: linux-x64-gnu
            build-os: ubuntu-latest
            test-os: ubuntu-latest
            flags: --use-napi-cross
          - target: aarch64-unknown-linux-gnu
            npm: linux-arm64-gnu
            build-os: ubuntu-latest
            test-os: ubuntu-24.04-arm
            flags: --use-napi-cross
          - target: x86_64-apple-darwin
            npm: darwin-x64
            build-os: macos-latest
            test-os: macos-15-intel
          - target: aarch64-apple-darwin
            npm: darwin-arm64
            build-os: macos-latest
            test-os: macos-latest
          - target: x86_64-pc-windows-msvc
            npm: win32-x64-msvc
            build-os: windows-latest
            test-os: windows-latest
    runs-on: ${{ matrix.build-os }}
    env:
      # The UI is built once by the `ui` job.
      BISONBASE_SKIP_UI_BUILD: '1'
    steps:
      # Vendored OpenSSL needs a native Windows perl, not Git Bash's.
      - if: runner.os == 'Windows'
        run: echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm ci --no-audit --no-fund
        working-directory: node
      - run: npm run build -- --target ${{ matrix.target }} ${{ matrix.flags }}
        working-directory: node
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: node/bisonbase.*.node
          if-no-files-found: error

  # `!cancelled()` lets each leg run even when another platform's build failed; a leg whose
  # own build failed then fails at the download step.
  test:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        include: *targets
    runs-on: ${{ matrix.test-os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.target }}
          path: node
      - run: npm test
        working-directory: node
      # Only binaries that passed their tests get a `verified-*` artifact, and only those publish.
      - uses: actions/upload-artifact@v7
        with:
          name: verified-${{ matrix.target }}
          path: node/bisonbase.*.node
          if-no-files-found: error

  publish-binding:
    needs: [check-tag, test]
    if: ${{ !cancelled() && needs.check-tag.result == 'success' && needs.test.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        include: *targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), no token needed
    defaults:
      run:
        working-directory: node/npm/${{ matrix.npm }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g npm@^11.5.1 # trusted publishing needs npm >= 11.5.1
      - uses: actions/download-artifact@v8
        with:
          name: verified-${{ matrix.target }}
          path: node/npm/${{ matrix.npm }}
      - name: Publish (skipped if this version is already on npm, e.g. on a re-run)
        run: |
          ls -l
          spec=$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already published"
          else
            npm publish
          fi

  publish:
    needs: [check-tag, publish-binding]
    if: ${{ !cancelled() && needs.check-tag.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), no token needed
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g npm@^11.5.1 # trusted publishing needs npm >= 11.5.1
      # List every binding, published or not, so a platform published later on a re-run works
      # without republishing this package. npm skips optional dependencies it can't install.
      - name: Point optionalDependencies at the platform packages
        run: |
          dirs=(npm/*/)
          missing=()
          for dir in "${dirs[@]}"; do
            spec=$(node -p "const p = require('./${dir}package.json'); \`\${p.name}@\${p.version}\`")
            npm pkg set "optionalDependencies.${spec%@*}=${spec##*@}"
            npm view "$spec" version >/dev/null 2>&1 || missing+=("$spec")
          done
          if [ ${#missing[@]} -eq ${#dirs[@]} ]; then
            echo "::error::no platform package was published"
            exit 1
          fi
          for spec in "${missing[@]}"; do
            echo "::warning::$spec isn't on npm; re-run its failed jobs to publish it"
          done
          node -p 'require("./package.json").optionalDependencies'
      # --ignore-scripts: skip prepublishOnly (`napi prepublish`), which needs every platform's
      # binary; the bindings were published by `publish-binding`.
      - run: npm publish --ignore-scripts
