# Checks the `bisonbase` client package and, on a `client-v*` tag, publishes it to npm.
# Run it by hand (Actions tab → client → Run workflow) to check without publishing.
name: client

on:
  push:
    tags: ['client-v*']
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: client

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # The end-to-end tests skip themselves: they need the server addon from ../node.
      - run: npm test
      - run: npm run build

  publish:
    if: startsWith(github.ref, 'refs/tags/client-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC), no token needed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g npm@^11.5.1 # trusted publishing needs npm >= 11.5.1
      - name: Check the tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "client-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match client/package.json version $version"
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      # prepublishOnly builds dist/.
      - run: npm publish
