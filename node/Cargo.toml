[package]
name = "bisonbase-node"
version = "0.1.0"
edition = "2024"
description = "Node.js bindings for bisonbase"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
napi = { version = "3", default-features = false, features = ["napi6", "tokio_rt", "async"] }
napi-derive = "3"
tokio = { version = "1", features = ["sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bisonbase = { path = ".." }
# Link OpenSSL statically so prebuilt binaries don't depend on the host's libssl.
openssl = { version = "0.10", features = ["vendored"] }

[build-dependencies]
napi-build = "2"
