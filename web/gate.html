<!doctype html>
<!-- A private node's sign-in page (src/gate.ts): all it shows to those it doesn't let in. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <title>Sign in</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; padding: 1rem; max-width: 22rem; text-align: center; }
      button { font: inherit; padding: 0.6rem 1.2rem; border-radius: 0.5rem; border: 1px solid #8884; background: transparent; color: inherit; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      p { margin: 0; font-size: 0.9rem; opacity: 0.75; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <button id="sign-in" disabled>Sign in with a passkey</button>
      <button id="new-passkey" hidden disabled>New passkey</button>
      <p id="message" hidden></p>
    </main>
    <script type="module" src="/src/gate.ts"></script>
  </body>
</html>
